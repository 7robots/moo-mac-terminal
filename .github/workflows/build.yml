name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        # v5 runs on node24. v4 ran on node20, which GitHub removes from its
        # runners on 2026-09-23 -- after that the v4 pin stops working.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Show build tools
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Moo.xcodeproj \
            -scheme Moo

      - name: Build Moo
        run: |
          xcodebuild build \
            -project Moo.xcodeproj \
            -scheme Moo \
            -configuration Debug \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      # The suite has to actually run. This workflow used to build only, which
      # is how 0.1.3 shipped with a failing settings test: nothing ever
      # executed it.
      #
      # Failed tests are retried, up to 3 runs in all. On the hosted runner the
      # test host sometimes dies mid-run (WebKit there logs sandbox denials
      # throughout), and xcodebuild marks whatever was running as failed even
      # though it passes on its own (dc67b21, 4e58272). Only the failed tests
      # rerun, so a real regression still fails every time and the job stays
      # red.
      - name: Test Moo
        run: |
          xcodebuild test \
            -project Moo.xcodeproj \
            -scheme Moo \
            -configuration Debug \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MooTests.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      # The result bundle holds the crash logs and per-test output that the
      # console log leaves out.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MooTests-xcresult
          path: ${{ runner.temp }}/MooTests.xcresult
          retention-days: 14
